name: Deploy to Firebase Hosting on release
'on':
  push:
    tags:
      - '*'
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  call-workflow-in-another-repo:
    uses: hotwax/accxui/.github/workflows/common-firebase-hosting-release.yml@7e3a71d3e6a3fc61241e3584c572c621f7a32ca6
    with:
      config-path: .github/labeler.yml
      app: hotwax/job-manager
      appDir: job-manager
      accxuiVersion: v1.11.0
      publishHostingInventory: true
      hostingToolsRef: 7e3a71d3e6a3fc61241e3584c572c621f7a32ca6
    secrets:
      envPAT: ${{ secrets.envPAT }}
      UAT_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.UAT_FIREBASE_SERVICE_ACCOUNT }}
