name: Deploy to Firebase Hosting on release
'on':
  workflow_dispatch:
    inputs:
      retainedRefs:
        description: 'Additional app refs to host (JSON array); candidate is always included'
        default: '["v3.3.0"]'
        required: true
        type: string
  push:
    tags:
      - '*'
jobs:
  call-workflow-in-another-repo:
    uses: hotwax/accxui/.github/workflows/common-firebase-hosting-release.yml@codex/job-manager-versioned-uat
    with:
      config-path: .github/labeler.yml
      app: hotwax/job-manager
      appDir: job-manager
      retainedRefs: ${{ inputs.retainedRefs || '["v3.3.0"]' }}
      accxuiVersion: f88b3acd00b89f9d2d2f8c8f86019b7f1998acd8 # verified backend persistence across tabs
    secrets:
      envPAT: ${{ secrets.envPAT }}
      HOTWAX_PUBLIC_SECRET: ${{ secrets.HOTWAX_PUBLIC_SECRET }}
