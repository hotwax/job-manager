name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
      - JUNE-15
      - codex/app-hosting-actions
jobs:
  call-workflow-in-another-repo:
    uses: hotwax/accxui/.github/workflows/common-firebase-hosting-merge.yml@codex/app-hosting-actions
    with:
      config-path: .github/labeler.yml
      app: hotwax/job-manager
      appDir: job-manager
    secrets:
      envPAT: ${{ secrets.envPAT }}
      DEV_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT }}
